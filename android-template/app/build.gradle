plugins {
    id 'com.android.application'
}

// Signing secrets are supplied through the worker process environment so they never appear in ps/command history.
def appdownKsFile = System.getenv('APPDOWN_KS_FILE')
def appdownKsPwd = System.getenv('APPDOWN_KS_STORE_PASSWORD')
def appdownKsAlias = System.getenv('APPDOWN_KS_ALIAS')
def appdownKsKeyPwd = System.getenv('APPDOWN_KS_KEY_PASSWORD')
def hasAppdownSigning = appdownKsFile && appdownKsPwd && appdownKsAlias && appdownKsKeyPwd

android {
    namespace 'com.webview.app'
    compileSdk 34

    defaultConfig {
        applicationId project.hasProperty('appId') ? project.property('appId') : 'com.webview.app'
        minSdk 21
        targetSdk 34
        versionCode project.hasProperty('vCode') ? project.property('vCode').toInteger() : 1
        versionName project.hasProperty('vName') ? project.property('vName') : '1.0.0'
    }

    signingConfigs {
        release {
            if (hasAppdownSigning) {
                storeFile file(appdownKsFile)
                storePassword appdownKsPwd
                keyAlias appdownKsAlias
                keyPassword appdownKsKeyPwd
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasAppdownSigning) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
