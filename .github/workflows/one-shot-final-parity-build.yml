name: One-shot Final Admin 2.0 Docs Cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-final-parity-build.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Finalize main README and changelog
        run: |
          python3 - <<'PY'
          from pathlib import Path
          r=Path('README.md').read_text(encoding='utf-8')
          old='- 站点设置、备份 / 恢复、PHP/SQLite 系统概览、Android/iOS Builder 路径与 Xcode 2FA、账户安全'
          new='- 站点设置、加密备份 / 恢复、APK/IPA 包信息解析、TTF/OTF 字体名自动识别、PHP/SQLite 系统概览、Android/iOS Builder 路径与 Xcode 2FA、账户安全'
          if old not in r: raise SystemExit('main README parity anchor missing')
          r=r.replace(old,new,1)
          Path('README.md').write_text(r,encoding='utf-8')
          c=Path('CHANGELOG.md').read_text(encoding='utf-8')
          anchor='- 补齐 Vue 与旧后台功能等价：应用特色分类/iOS OTA/Mobileconfig/安装型下载与截图排序，Mobileconfig 编辑/关联/证书维护，以及 Builder 自定义路径、Xcode Apple ID + 2FA 安装。\n'
          extra='- 最终旧后台功能对照补齐：附件页恢复 APK/IPA 包信息解析，字体上传恢复 TTF/OTF 内部字体名识别，备份恢复密码二次确认与管理员账户默认不勾选，并补齐媒体库 GIF / 拖拽和账户表单校验。\n'
          if extra not in c:
            if anchor not in c: raise SystemExit('main changelog parity anchor missing')
            c=c.replace(anchor,anchor+extra,1)
          Path('CHANGELOG.md').write_text(c,encoding='utf-8')
          PY
      - name: Commit main docs and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-final-parity-build.yml
          git add README.md CHANGELOG.md
          git commit -m 'docs: document final Admin 2.0 legacy parity'
          git push origin HEAD:main
      - name: Finalize SaaS docs
        run: |
          git fetch origin saas
          git switch -C saas origin/saas
          python3 - <<'PY'
          from pathlib import Path
          r=Path('README.md').read_text(encoding='utf-8')
          old='租户 Admin 2.0 已覆盖真实业务能力：应用、iOS OTA、Mobileconfig、安装型下载、截图、附件、APK/IPA Builder、构建产物、Keystore、页面模板、内容组件、完整媒体库、字体、站点设置、自定义代码、备份恢复、系统概览、Builder 自定义路径、Xcode 2FA 和账户安全。'
          new='租户 Admin 2.0 已覆盖真实业务能力：应用、iOS OTA、Mobileconfig、安装型下载、截图、附件、APK/IPA 包信息解析与 Builder、构建产物、Keystore、页面模板、内容组件、完整媒体库、TTF/OTF 字体名自动识别、站点设置、自定义代码、加密备份恢复、系统概览、Builder 自定义路径、Xcode 2FA 和账户安全。'
          if old not in r: raise SystemExit('saas README parity anchor missing')
          r=r.replace(old,new,1)
          Path('README.md').write_text(r,encoding='utf-8')
          c=Path('CHANGELOG.md').read_text(encoding='utf-8')
          anchor='- 补齐租户 Vue 与旧后台功能等价：应用 iOS OTA/Mobileconfig/安装型下载、内容组件全字段、Mobileconfig 编辑/关联/证书维护，以及 Builder 路径和 Xcode Apple ID + 2FA 安装流程。\n'
          extra='- 最终旧后台功能对照补齐：附件 APK/IPA 包信息解析、TTF/OTF 内部字体名识别、备份密码二次确认/管理员账户默认不勾选、媒体库 GIF/拖拽和账户表单校验。\n'
          if extra not in c:
            if anchor not in c: raise SystemExit('saas changelog parity anchor missing')
            c=c.replace(anchor,anchor+extra,1)
          Path('CHANGELOG.md').write_text(c,encoding='utf-8')
          PY
          git add README.md CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs(saas): document final tenant Admin 2.0 parity'
            git push origin HEAD:saas
          fi
