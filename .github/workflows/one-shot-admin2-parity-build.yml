name: One-shot Admin 2.0 Docs And Cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-admin2-parity-build.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch main documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          r=Path('README.md').read_text()
          r=r.replace('- 分发首页模板、特色卡片 / 分类 / 友情链接、字体、自定义代码','- 分发首页模板、特色卡片 / 分类 / 友情链接、完整媒体库、字体、自定义代码')
          r=r.replace('- 站点设置、备份 / 恢复、Android/iOS 构建环境、账户安全','- 站点设置、备份 / 恢复、PHP/SQLite 系统概览、Android/iOS Builder 路径与 Xcode 2FA、账户安全')
          Path('README.md').write_text(r)
          c=Path('CHANGELOG.md').read_text()
          anchor='- Admin 2.0 接入真实 PHP API，覆盖应用、附件、APK/IPA Builder、构建产物、Keystore、Mobileconfig、模板、内容组件、字体、设置、自定义代码、备份、系统、账户与在线升级。\n'
          extra='- 新增完整图片媒体库：分类、上传、WebP/JPG/PNG 转换质量、重命名、备注、排序与路径复制。\n- 补齐 Vue 与旧后台功能等价：应用特色分类/iOS OTA/Mobileconfig/安装型下载与截图排序，Mobileconfig 编辑/关联/证书维护，以及 Builder 自定义路径、Xcode Apple ID + 2FA 安装。\n'
          if extra not in c:
              if anchor not in c: raise SystemExit('main changelog anchor missing')
              c=c.replace(anchor,anchor+extra,1)
          Path('CHANGELOG.md').write_text(c)
          PY
      - name: Commit main docs and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-admin2-parity-build.yml
          git add README.md CHANGELOG.md
          git commit -m 'docs: finalize complete Admin 2.0 feature parity'
          git push origin HEAD:main
      - name: Patch SaaS documentation and remove old one-shot workflow
        run: |
          git fetch origin saas
          git switch -C saas origin/saas
          python3 - <<'PY'
          from pathlib import Path
          r=Path('README.md').read_text()
          r=r.replace('租户 Admin 2.0 已覆盖真实业务能力：应用、下载方式、截图、附件、APK/IPA Builder、构建产物、Keystore、Mobileconfig、页面模板、内容组件、字体、站点设置、自定义代码、备份恢复、环境检测和账户安全。','租户 Admin 2.0 已覆盖真实业务能力：应用、iOS OTA、Mobileconfig、安装型下载、截图、附件、APK/IPA Builder、构建产物、Keystore、页面模板、内容组件、完整媒体库、字体、站点设置、自定义代码、备份恢复、系统概览、Builder 自定义路径、Xcode 2FA 和账户安全。')
          Path('README.md').write_text(r)
          c=Path('CHANGELOG.md').read_text()
          anchor='- 租户 Admin 2.0 覆盖应用、附件、APK/IPA Builder、构建产物、Keystore、Mobileconfig、9 套页面模板、内容组件、字体、设置、备份、系统与账户能力。\n'
          extra='- 租户后台新增完整图片媒体库，并补齐分类、图片转换压缩、重命名、排序与路径复制。\n- 补齐租户 Vue 与旧后台功能等价：应用 iOS OTA/Mobileconfig/安装型下载、内容组件全字段、Mobileconfig 编辑/关联/证书维护，以及 Builder 路径和 Xcode Apple ID + 2FA 安装流程。\n'
          if extra not in c:
              if anchor not in c: raise SystemExit('saas changelog anchor missing')
              c=c.replace(anchor,anchor+extra,1)
          Path('CHANGELOG.md').write_text(c)
          PY
          git rm -f .github/workflows/one-shot-saas-admin2-rebuild.yml 2>/dev/null || true
          git add README.md CHANGELOG.md .github/workflows
          if ! git diff --cached --quiet; then
            git commit -m 'docs(saas): finalize tenant Admin 2.0 feature parity'
            git push origin HEAD:saas
          fi
