name: One-shot Admin 2.0 Docs
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-admin2-docs.yml'
permissions:
  contents: write
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch main documentation
        run: |
          cp tools/patch_admin2_docs.py /tmp/patch_admin2_docs.py
          APPDOWN_DOC_EDITION=main python3 /tmp/patch_admin2_docs.py
      - name: Commit main documentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: document Admin 2.0 and structural landing templates'
            git push origin HEAD:main
          fi
      - name: Patch and commit SaaS documentation
        run: |
          git fetch origin saas
          git switch -C saas origin/saas
          APPDOWN_DOC_EDITION=saas python3 /tmp/patch_admin2_docs.py
          git add README.md CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs(saas): document tenant Admin 2.0 and template layouts'
            git push origin HEAD:saas
          fi
