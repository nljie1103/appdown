name: One-shot Landing 2.0 Sync 2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-landing2-sync2.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch main landing page
        run: python3 tools/patch_landing2.py
      - name: Commit main landing integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'feat: activate structural landing layouts'
            git push origin HEAD:main
          fi
      - name: Sync shared landing files to SaaS
        run: |
          git fetch origin main saas
          git switch -C saas origin/saas
          git checkout origin/main -- index.html includes/landing_templates.php static/landing-layouts.css static/landing-layouts.js admin/templates.php
          git add index.html includes/landing_templates.php static/landing-layouts.css static/landing-layouts.js admin/templates.php
          if ! git diff --cached --quiet; then
            git commit -m 'feat(saas): sync structural landing templates'
            git push origin HEAD:saas
          fi
