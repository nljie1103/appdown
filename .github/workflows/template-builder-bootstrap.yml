name: Temporary Template Builder Bootstrap

on:
  push:
    branches: [dev-template-builder-2]

permissions:
  contents: write

jobs:
  android-mother:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install AppDown Android environment
        run: sudo bash tools/setup-android-env.sh
      - name: Prepare patchable launcher resources
        working-directory: android-template
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick >/dev/null
          rm -f app/src/main/res/mipmap/ic_launcher.xml
          for spec in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            density="${spec%%:*}"
            size="${spec##*:}"
            dir="app/src/main/res/mipmap-${density}"
            mkdir -p "$dir"
            convert -size "${size}x${size}" xc:'#2563EB' \
              -fill white -gravity center -pointsize "$(( size / 3 ))" -font DejaVu-Sans-Bold \
              -annotate +0+0 'A' "$dir/ic_launcher.png"
            file "$dir/ic_launcher.png" | grep -F 'PNG image data'
          done
      - name: Build unsigned Android mother APK
        working-directory: android-template
        run: |
          set -euo pipefail
          export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          chmod +x gradlew
          ./gradlew assembleRelease -PappId=com.appdown.template -PvName=1.0.0 -PvCode=1 --no-daemon
          cp app/build/outputs/apk/release/app-release.apk /tmp/android-webview-template.apk
          test -s /tmp/android-webview-template.apk
          unzip -t /tmp/android-webview-template.apk >/dev/null
          unzip -l /tmp/android-webview-template.apk | grep -F 'res/' | grep -F 'ic_launcher'
      - uses: actions/upload-artifact@v4
        with:
          name: android-mother
          path: /tmp/android-webview-template.apk

  ios-mother:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned iOS mother IPA
        working-directory: ios-template
        run: |
          set -euo pipefail
          xcodebuild -project WebViewApp.xcodeproj -scheme WebViewApp -configuration Release \
            -destination 'generic/platform=iOS' -archivePath /tmp/appdown-template.xcarchive \
            archive CODE_SIGNING_ALLOWED=NO
          APP_PATH="$(find /tmp/appdown-template.xcarchive/Products/Applications -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          rm -rf /tmp/appdown-ipa && mkdir -p /tmp/appdown-ipa/Payload
          cp -R "$APP_PATH" /tmp/appdown-ipa/Payload/
          cd /tmp/appdown-ipa
          /usr/bin/zip -qry /tmp/ios-webview-template.ipa Payload
          unzip -t /tmp/ios-webview-template.ipa >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: ios-mother
          path: /tmp/ios-webview-template.ipa

  vue-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json
      - name: Build Admin 2.0
        working-directory: admin-ui
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: admin-vue
          path: admin/vue

  commit-generated:
    if: github.actor != 'github-actions[bot]'
    needs: [android-mother, ios-mother, vue-assets]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-template-builder-2
      - uses: actions/download-artifact@v4
        with:
          name: android-mother
          path: /tmp/android
      - uses: actions/download-artifact@v4
        with:
          name: ios-mother
          path: /tmp/ios
      - uses: actions/download-artifact@v4
        with:
          name: admin-vue
          path: /tmp/admin-vue
      - name: Commit precompiled mothers and production Vue assets
        run: |
          set -euo pipefail
          mkdir -p builder/templates
          cp /tmp/android/android-webview-template.apk builder/templates/android-webview-template.apk
          cp /tmp/ios/ios-webview-template.ipa builder/templates/ios-webview-template.ipa
          rm -rf admin/vue
          mkdir -p admin/vue
          cp -a /tmp/admin-vue/. admin/vue/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builder/templates admin/vue
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: generate Template Builder mother packages"
          git push origin HEAD:dev-template-builder-2
