# One-shot publisher for the v1.0.0 release.
name: Publish AppDown v1.0.0

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v1.0.0.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create v1.0.0 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request

          owner, repo = os.environ['REPOSITORY'].split('/', 1)
          token = os.environ['GH_TOKEN']
          target = os.environ['TARGET_SHA']
          tag = 'v1.0.0'
          api = f'https://api.github.com/repos/{owner}/{repo}'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
          }

          try:
              req = urllib.request.Request(f'{api}/releases/tags/{tag}', headers=headers)
              with urllib.request.urlopen(req) as response:
                  existing = json.load(response)
              print('Release already exists:', existing.get('html_url', tag))
              raise SystemExit(0)
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise

          body = '''AppDown v1.0.0 — Security & Quality Hardening

          面向个人/小团队自建 IPA/APK 分发场景的一次集中加固，保持 PHP + SQLite + 原生前端架构，不增加 Redis、MySQL、Node 或额外服务依赖。

          主要更新：
          - Apache / Nginx 安全规则对齐，补齐 cert / keystore / 私钥目录保护。
          - Android Keystore 密码与 Mobileconfig 私钥改为 AES-256-GCM 存储，并兼容旧明文数据惰性迁移。
          - Mobileconfig 私钥不再返回浏览器；编辑留空私钥时保留原值。
          - APK 签名密码移出 Gradle 命令行，构建日志增加 Secrets 脱敏。
          - 可信代理真实 IP、登录限流、密码修改后的旧 Session 失效机制加固。
          - APK / IPA 上传增加真实包结构检查；Keystore 增加实际解析验证。
          - 备份升级至 v3：AES-256-GCM + Argon2id/PBKDF2，兼容旧备份并支持跨服务器迁移签名材料。
          - ZIP 导入增加路径遍历、解压大小、文件数量、异常压缩比检查。
          - 新增 SQLite 自动备份、保留策略、孤儿文件保守清理、证书到期提醒和版本历史摘要。
          - 新增 SECURITY.md、UPGRADE.md、CHANGELOG.md、nginx-security.conf.example。

          升级 Nginx / 宝塔站点时，请务必同步 nginx-security.conf.example；Nginx 不读取 .htaccess。
          详细升级事项请查看 UPGRADE.md，完整变更请查看 CHANGELOG.md。'''

          payload = json.dumps({
              'tag_name': tag,
              'target_commitish': target,
              'name': 'AppDown v1.0.0',
              'body': body,
              'draft': False,
              'prerelease': False,
          }, ensure_ascii=False).encode('utf-8')
          req = urllib.request.Request(f'{api}/releases', data=payload, headers=headers, method='POST')
          with urllib.request.urlopen(req) as response:
              created = json.load(response)
          print('Published:', created.get('html_url', tag))
          PY
