name: Validate and publish SaaS v1.0.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-saas-v1.0.1.yml'

permissions:
  contents: write

jobs:
  validate-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Clone SaaS branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch saas "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Fix test entrypoint and documentation
        working-directory: repo
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('tests/smoke_templates.php')
          s = p.read_text()
          old = "$root = dirname(__DIR__);\n\n"
          new = """$root = dirname(__DIR__);\n\n// On the SaaS edition, the dedicated smoke test already covers landing-template\n// rendering together with real tenant context, SQLite isolation and ZipArchive.\n// Delegate instead of running the single-site fixture without a tenant, which\n// would make require_tenant_context() exit before assertions are reached.\nif (is_file($root . '/includes/saas.php')) {\n    require __DIR__ . '/smoke_saas.php';\n    exit(0);\n}\n\n"""
          if s.count(old) != 1:
              raise SystemExit(f'smoke_templates anchor count={s.count(old)}')
          p.write_text(s.replace(old, new, 1))

          p = Path('README.md')
          s = p.read_text()
          old = "> 本次开发过程中用户提供的 `扩展.zip` 在 ChatGPT 文件接口中没有实际挂载成功，因此不能声称使用了该附件。仓库测试改为在 GitHub Ubuntu Runner 上安装系统 `php-zip`，并用真实 `ZipArchive` 完成端到端压缩包测试。"
          new = """> SaaS 分支中的 `tests/smoke_templates.php` 会自动委托给 `tests/smoke_saas.php`，避免在没有租户上下文时公共配置 API 提前退出却返回状态码 0 的假阳性。\n>\n> `saas-v1.0.1` 还在独立 PHP 8.4.23 容器中使用离线提供的 `pdo_sqlite` / `sqlite3` / `zip` / `mbstring` / `curl` / `gd` 扩展，对正式 Release 源码重新执行了原仓库测试；单用户 `v1.1.0` 的模板 smoke test 与 SaaS 的双租户 + ZipArchive smoke test均真实通过。"""
          if s.count(old) != 1:
              raise SystemExit(f'README validation-note anchor count={s.count(old)}')
          p.write_text(s.replace(old, new, 1))

          p = Path('CHANGELOG.md')
          s = p.read_text()
          anchor = '# Changelog\n\n'
          section = """## saas-v1.0.1 - 2026-08-11\n\n测试与文档补丁版本，不改变 SaaS 运行时业务逻辑。\n\n### Validation\n\n- 修复 SaaS 分支 `tests/smoke_templates.php` 单独运行时缺少租户上下文却可能以状态码 0 提前退出的问题。\n- SaaS 下运行 `smoke_templates.php` 现在会委托给覆盖模板渲染、双租户 SQLite、主密钥隔离和 ZipArchive 的 `smoke_saas.php`，测试不会再假阳性。\n- 在独立 PHP 8.4.23 容器中使用离线 `pdo_sqlite` / `sqlite3` / `zip` / `mbstring` / `curl` / `gd` 扩展，对 `v1.1.0` 与 `saas-v1.0.0` Release 源码重新执行原仓库 smoke test 并通过。\n- README 更新真实测试环境与测试入口说明，移除已经过时的附件未挂载说明。\n\n"""
          if not s.startswith(anchor):
              raise SystemExit('CHANGELOG header changed')
          p.write_text(anchor + section + s[len(anchor):])
          PY

      - name: PHP 8.0 syntax check
        working-directory: repo
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/app" -w /app php:8.0-cli sh -lc 'find . -type f -name "*.php" -print0 | xargs -0 -n1 php -l'

      - name: Install runtime extensions
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3 php-zip php-mbstring php-curl php-gd >/dev/null
          php -m | grep -qi '^pdo_sqlite$'
          php -m | grep -qi '^sqlite3$'
          php -m | grep -qi '^zip$'
          php -m | grep -qi '^mbstring$'

      - name: Run repository smoke tests
        working-directory: repo
        run: |
          set -euo pipefail
          php tests/smoke_templates.php
          php tests/smoke_saas.php

      - name: Commit and push SaaS patch
        id: push
        working-directory: repo
        run: |
          set -euo pipefail
          git config user.name "Jay Leon"
          git config user.email "59471244+nljie1103@users.noreply.github.com"
          git add tests/smoke_templates.php README.md CHANGELOG.md
          git commit -m "test(saas): eliminate template smoke false positive"
          git push origin saas
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish SaaS v1.0.1 release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.push.outputs.sha }}
        run: |
          set -euo pipefail
          if gh release view saas-v1.0.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "saas-v1.0.1 already exists"
            exit 0
          fi
          gh release create saas-v1.0.1 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "AppDown SaaS v1.0.1" \
            --notes "测试与文档补丁版本，不改变运行时业务逻辑。修复 SaaS 下 smoke_templates.php 缺少租户上下文时可能假阳性的问题；现在该入口委托给完整 smoke_saas.php。发布前已通过 PHP 8.0 全仓语法检查，并在真实 pdo_sqlite/sqlite3/ZipArchive/mbstring 环境中执行两个仓库 smoke test。README 与 CHANGELOG 已同步更新。"
