name: Temporary Builder Docs Main

on:
  push:
    branches: [dev-builder-docs-main]

permissions:
  contents: write

jobs:
  docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-builder-docs-main
      - name: Refresh and validate Builder 2.0 docs
        run: |
          set -euo pipefail
          python3 tools/temporary-update-builder-docs-main.py
          git diff --check
          grep -F 'Template Builder 2.0（默认快速路线）' README.md
          grep -F '## Unreleased — Builder 2.0' CHANGELOG.md
      - name: Commit documentation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md
          git diff --cached --check
          git commit -m "docs: document Template Builder 2.0"
          git push origin HEAD:dev-builder-docs-main
