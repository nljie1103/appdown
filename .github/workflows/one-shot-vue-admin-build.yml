name: One-shot Vue Admin Build
# retry 6: migrate Lucide package, rebuild and sync
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-vue-admin-build.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Migrate icon imports and lock dependencies
        run: |
          grep -rl "from 'lucide-vue-next'" admin-ui/src --include='*.vue' --include='*.ts' | xargs -r sed -i "s/from 'lucide-vue-next'/from '@lucide\/vue'/g"
          cd admin-ui
          npm install --no-audit --no-fund
      - name: Build Vue 3 admin
        working-directory: admin-ui
        run: npm run build
      - name: Verify production assets
        run: |
          test -s admin/vue/admin2.js
          test -s admin/vue/admin2.css
          grep -q 'AppDown' admin/vue/admin2.js
          ! grep -R "lucide-vue-next" admin-ui/src admin-ui/package.json
      - name: Commit main dependency migration and build output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-ui admin/vue
          git reset admin-ui/node_modules 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'chore: migrate Admin 2.0 to current Lucide Vue package'
            git push origin HEAD:main
          fi
      - name: Sync Vue admin and landing engine to SaaS
        run: |
          rm -rf admin-ui/node_modules
          git fetch origin main saas
          git switch -C saas origin/saas
          git checkout origin/main -- admin-ui admin/app.php admin/vue static/landing-layouts.js
          git add admin-ui admin/app.php admin/vue static/landing-layouts.js
          if ! git diff --cached --quiet; then
            git commit -m 'feat(saas): sync current Admin 2.0 frontend'
            git push origin HEAD:saas
          fi
