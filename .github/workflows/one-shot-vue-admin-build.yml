name: One-shot Vue Admin Build
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-vue-admin-build.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin-ui/package.json
      - name: Install and build Vue 3 admin
        working-directory: admin-ui
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Verify production assets
        run: |
          test -s admin/vue/admin2.js
          test -s admin/vue/admin2.css
          grep -q 'AppDown' admin/vue/admin2.js
      - name: Commit main build output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-ui/package-lock.json admin/vue
          if ! git diff --cached --quiet; then
            git commit -m 'build: compile AppDown Admin 2.0 Vue assets'
            git push origin HEAD:main
          fi
      - name: Sync Vue admin source and build to SaaS
        run: |
          git fetch origin main saas
          git switch -C saas origin/saas
          git checkout origin/main -- admin-ui admin/app.php admin/vue
          git add admin-ui admin/app.php admin/vue
          if ! git diff --cached --quiet; then
            git commit -m 'feat(saas): sync AppDown Admin 2.0 Vue frontend'
            git push origin HEAD:saas
          fi
