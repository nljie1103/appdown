name: One-shot Vue Admin Build
# retry 7: final Admin 2.0 builder parity + Aurora showcase sync
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-vue-admin-build.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json
      - name: Build Vue 3 admin
        working-directory: admin-ui
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Verify production assets and template engine
        run: |
          test -s admin/vue/admin2.js
          test -s admin/vue/admin2.css
          test -s static/landing-showcase.css
          grep -q 'AppDown' admin/vue/admin2.js
          grep -q 'adl-showcase-controls' static/landing-showcase.css
          grep -q 'landing-showcase.css' static/landing-layouts.js
      - name: Commit main build output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/vue
          if ! git diff --cached --quiet; then
            git commit -m 'build: compile final AppDown Admin 2.0 assets'
            git push origin HEAD:main
          fi
      - name: Sync Vue admin and Aurora showcase to SaaS
        run: |
          rm -rf admin-ui/node_modules
          git fetch origin main saas
          git switch -C saas origin/saas
          git checkout origin/main -- admin-ui admin/app.php admin/vue static/landing-layouts.js static/landing-showcase.css
          git add admin-ui admin/app.php admin/vue static/landing-layouts.js static/landing-showcase.css
          if ! git diff --cached --quiet; then
            git commit -m 'feat(saas): sync final Admin 2.0 and Aurora showcase'
            git push origin HEAD:saas
          fi
