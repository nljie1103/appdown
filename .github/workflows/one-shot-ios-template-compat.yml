name: One-shot iOS Template Compatibility

on:
  push:
    branches: [fix-v1.3.1-main]

permissions:
  contents: write

jobs:
  compat:
    if: ${{ !contains(github.event.head_commit.message, '[ios-compat-built]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-v1.3.1-main
      - name: Make project Xcode 12 compatible and generate default icons
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import struct, zlib, binascii

          p=Path('ios-template/WebViewApp.xcodeproj/project.pbxproj')
          s=p.read_text()
          repl={
            'objectVersion = 56;':'objectVersion = 54;',
            'BuildIndependentTargetsInParallel = 1;\n':'',
            'LastSwiftUpdateCheck = 1500;':'LastSwiftUpdateCheck = 1240;',
            'LastUpgradeCheck = 1500;':'LastUpgradeCheck = 1240;',
            'compatibilityVersion = "Xcode 14.0";':'compatibilityVersion = "Xcode 12.0";',
            'CLANG_CXX_LANGUAGE_STANDARD = "gnu++20";':'CLANG_CXX_LANGUAGE_STANDARD = "gnu++14";',
            'IPHONEOS_DEPLOYMENT_TARGET = 15.0;':'IPHONEOS_DEPLOYMENT_TARGET = 14.0;',
            '\t\t\t\tASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS = YES;\n':'',
            '\t\t\t\tSWIFT_EMIT_LOC_STRINGS = YES;\n':'',
          }
          for old,new in repl.items(): s=s.replace(old,new)
          p.write_text(s)

          def png_rgb(width,height,r=37,g=99,b=235):
              def chunk(kind,data):
                  return struct.pack('>I',len(data))+kind+data+struct.pack('>I',binascii.crc32(kind+data)&0xffffffff)
              raw=b''.join(b'\x00'+bytes((r,g,b))*width for _ in range(height))
              return b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',width,height,8,2,0,0,0))+chunk(b'IDAT',zlib.compress(raw,9))+chunk(b'IEND',b'')

          icons={
            'icon-20@2x.png':40,'icon-20@3x.png':60,
            'icon-29@2x.png':58,'icon-29@3x.png':87,
            'icon-40@2x.png':80,'icon-40@3x.png':120,
            'icon-60@2x.png':120,'icon-60@3x.png':180,
            'icon-76@1x.png':76,'icon-76@2x.png':152,
            'icon-83.5@2x.png':167,'icon-1024.png':1024,
          }
          root=Path('ios-template/WebViewApp/Assets.xcassets/AppIcon.appiconset')
          for name,size in icons.items(): (root/name).write_bytes(png_rgb(size,size))
          PY
          grep -F 'objectVersion = 54;' ios-template/WebViewApp.xcodeproj/project.pbxproj
          grep -F 'compatibilityVersion = "Xcode 12.0";' ios-template/WebViewApp.xcodeproj/project.pbxproj
          grep -F 'IPHONEOS_DEPLOYMENT_TARGET = 14.0;' ios-template/WebViewApp.xcodeproj/project.pbxproj
          test -s ios-template/WebViewApp/Assets.xcassets/AppIcon.appiconset/icon-1024.png
      - name: Commit compatibility assets
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ios-template
          git commit -m 'fix: make iOS template Xcode 12 compatible with default icons [ios-compat-built]'
          git push origin HEAD:fix-v1.3.1-main
