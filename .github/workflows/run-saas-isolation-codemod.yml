name: Run SaaS Release Validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-saas-isolation-codemod.yml'

permissions:
  contents: write

jobs:
  validate-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Clone SaaS branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch saas "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Apply release finalizer
        working-directory: repo
        run: python3 tools/saas-release-finalize.py

      - name: PHP syntax check
        working-directory: repo
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Install real runtime extensions
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3 php-zip php-curl php-gd php-mbstring >/dev/null
          php -m | grep -qi '^pdo_sqlite$'
          php -m | grep -qi '^zip$'
          php -m | grep -qi '^mbstring$'

      - name: Run landing template integration test
        working-directory: repo
        run: php tests/smoke_templates.php

      - name: Run two-tenant and ZipArchive integration test
        working-directory: repo
        run: php tests/smoke_saas.php

      - name: Commit validated SaaS release candidate
        working-directory: repo
        run: |
          set -euo pipefail
          git config user.name "Jay Leon"
          git config user.email "59471244+nljie1103@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "test(saas): validate tenant isolation and archive handling"
          git push origin saas
